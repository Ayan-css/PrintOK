# Render Blueprint for the PrintOk Cloud API.
#
# The service was originally configured by hand in the Render dashboard; this
# file records the intended configuration so it is reviewable in git. Applying
# it as a Blueprint is optional — `services/api`'s `start` script runs
# `prisma migrate deploy` on every boot either way, so a deploy can never serve
# application code against an un-migrated database.

services:
  - type: web
    name: prinok-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start --workspace=@printok/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase Postgres connection string (pooled, port 6543).
      - key: DATABASE_URL
        sync: false
      # Direct/session connection for Prisma Migrate only. Migrations hang on a
      # transaction pooler, so this must use the session port (Supabase: 5432).
      - key: DIRECT_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AGENT_PAIRING_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Email. Without these, contact enquiries reach nobody and a shop owner
      # who forgets their password cannot get back in. Set EMAIL_PROVIDER to
      # 'resend' once the other three are filled in.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      # The public URL of the customer front-end, e.g. https://printok.vercel.app.
      # Required in production: shop registration refuses to issue a QR poster
      # without it, rather than printing a code that could never be scanned.
      - key: PUBLIC_WEB_URL
        sync: false
      # Extra browser origins allowed to call this API, comma separated.
      # Optional: printok.vercel.app, the older print-ok-customer-web.vercel.app
      # that printed QR posters still encode, this project's Vercel previews and
      # localhost are allowed without it. Set this when a new frontend domain
      # needs to work before a deploy can ship — see services/api/src/corsPolicy.ts.
      - key: ALLOWED_ORIGINS
        sync: false
      # Set to "true" only once Razorpay has activated Route on the account.
      # Until then the API keeps taking payments through the single-account
      # flow, so leaving this unset is safe.
      - key: RAZORPAY_ROUTE_ENABLED
        value: "false"
      - key: PRINT_AGENT_REPO
        value: Ayan-css/PrintOK
