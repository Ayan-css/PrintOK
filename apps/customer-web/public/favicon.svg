<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0e5e6f"/>
  <!-- Printer body -->
  <rect x="6" y="8" width="20" height="14" rx="2" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Paper in tray -->
  <rect x="10" y="18" width="12" height="7" rx="1" fill="none" stroke="white" stroke-width="2"/>
  <!-- Slot line -->
  <line x1="10" y1="13" x2="22" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Registration dot (print motif) -->
  <circle cx="26" cy="7" r="2.5" fill="none" stroke="white" stroke-width="1.5"/>
  <line x1="26" y1="4" x2="26" y2="10" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="7" x2="29" y2="7" stroke="white" stroke-width="1" stroke-linecap="round"/>
</svg>
