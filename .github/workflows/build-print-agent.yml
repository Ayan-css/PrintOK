name: Build and Release Print Agent

on:
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - '.github/workflows/build-print-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/build-print-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The agent is built from one core on two hosts. This job proves the core
  # still compiles without Windows, which is the thing that quietly breaks the
  # moment someone adds a WinForms reference to the wrong project.
  linux:
    name: Core and console (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the console agent for Linux
        run: >
          dotnet build agent/windows-print-agent/WindowsPrintAgent.csproj
          -c Release -r linux-x64 --self-contained false
          -warnaserror

      # The core's logic is testable without a printer, a console or a network,
      # so it is tested here rather than only on a shop PC.
      - name: Test the core
        run: dotnet test agent/PrintOk.Agent.Core.Tests/PrintOk.Agent.Core.Tests.csproj -c Release --nologo

  windows:
    name: Console and desktop agent (win-x64)
    runs-on: windows-latest
    env:
      # Signing runs only once the Azure Trusted Signing secrets exist; until
      # then builds stay unsigned and Windows SmartScreen warns on install.
      SIGNING_ENABLED: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------------------------------------------------------- console ---
      - name: Publish the console agent
        # Self-contained so a shop PC can run it without installing .NET, and
        # single-file so the .exe works without its sibling DLLs.
        run: >
          dotnet publish agent/windows-print-agent/WindowsPrintAgent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o bin/console

      # ---------------------------------------------------------------- desktop ---
      - name: Publish the desktop agent
        run: >
          dotnet publish agent/PrintOk.Agent.Tray/PrintOk.Agent.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o bin/desktop

      - name: Verify both executables are standalone
        shell: pwsh
        run: |
          function Assert-SelfContained($path, $name) {
            if (-not (Test-Path $path)) { throw "Publish did not produce $path" }
            $mb = [math]::Round((Get-Item $path).Length / 1MB, 2)
            Write-Host "$name is $mb MB"
            # A framework-dependent apphost stub is ~0.15 MB; a self-contained
            # single-file build is tens of MB. Fail loudly if we shipped the stub.
            if ((Get-Item $path).Length -lt 20MB) {
              throw "$name is only $mb MB - it is not self-contained and will not run on a shop PC."
            }
          }

          Assert-SelfContained 'bin/console/WindowsPrintAgent.exe' 'WindowsPrintAgent.exe'
          Assert-SelfContained 'bin/desktop/PrintOkAgent.exe'      'PrintOkAgent.exe'

          if (-not (Test-Path 'bin/console/appsettings.json')) {
            throw "appsettings.json template missing from the console publish"
          }

      - name: Sign the executables
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: bin
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # -------------------------------------------------------------- installer ---
      - name: Build the Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path agent/dist | Out-Null
          Copy-Item bin/desktop/PrintOkAgent.exe agent/dist/

          # ${env:...} braces are required: the variable name contains
          # parentheses, and $env:ProgramFiles(x86) parses as $env:ProgramFiles
          # followed by a separate (x86) expression, which is a syntax error.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          # Inno Setup is normally present on the windows runner image, but that
          # is the image's choice and not a guarantee. Install it rather than
          # fail a release build on someone else's packaging decision.
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this image; installing."
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe still not found after install" }

          Write-Host "Using $iscc"
          & $iscc agent/installer/PrintOkAgent.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

          $setup = Get-ChildItem agent/dist/PrintOkAgentSetup-*.exe -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Inno Setup reported success but produced no installer" }
          Write-Host "Installer: $($setup.Name) $([math]::Round($setup.Length/1MB,2)) MB"

          # A second copy under a name that does not move. The dashboard's
          # download button is a fixed redirect to this release, and a filename
          # carrying the version would break that link on every version bump.
          # The versioned file is still published, for anyone pinning one.
          Copy-Item $setup.FullName agent/dist/PrintOkAgentSetup.exe

      - name: Sign the installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: agent/dist
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Stage the release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item bin/console/WindowsPrintAgent.exe bundle/
          Copy-Item bin/console/appsettings.json bundle/
          Copy-Item agent/windows-print-agent/INSTALL.md bundle/README.txt
          Compress-Archive -Path bundle/* -DestinationPath PrintAgent-win-x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: print-agent-win-x64
          path: |
            bin/desktop/PrintOkAgent.exe
            bin/console/WindowsPrintAgent.exe
            agent/dist/*.exe

      - name: Create or update the GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PrintOk Print Agent (Latest Release)
          body: |
            The print agent for PrintOk shops. No .NET runtime install required.

            Windows will show "Windows protected your PC" with an unknown
            publisher: these builds are not code-signed yet. Click
            **More info → Run anyway**.

            **Most shops want the installer.**

            - `PrintOkAgentSetup.exe` — recommended, and what the dashboard's
              download button gives you. Installs the desktop agent,
              starts it with Windows, and keeps it in the system tray. Open it from
              the tray to check the connection, see printers, pair, or read logs.
            - `PrintOkAgent.exe` — the desktop agent on its own, no installer.
            - `PrintAgent-win-x64.zip` — the headless console agent, for unattended
              or scripted installs. Executable, `appsettings.json` template and setup
              instructions.
            - `WindowsPrintAgent.exe` — the console agent on its own. It knows the
              PrintOk cloud address already; pass `--PrintOkApiUrl=<url>` to override.
          draft: false
          prerelease: false
          files: |
            agent/dist/PrintOkAgentSetup.exe
            agent/dist/PrintOkAgentSetup-*.exe
            bin/desktop/PrintOkAgent.exe
            PrintAgent-win-x64.zip
            bin/console/WindowsPrintAgent.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
